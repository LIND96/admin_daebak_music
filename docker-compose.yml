services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admin_daebak_music
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: admin_daebak_music
      DB_SSLMODE: disable
      # Semua nilai sensitif/beda-per-environment via ${VAR:-default} agar cukup
      # `export VAR=...` sebelum `docker compose up` (lihat ~/deploy.env).
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
      REFRESH_EXPIRY_ADMIN: ${REFRESH_EXPIRY_ADMIN:-24h}
      REFRESH_EXPIRY_CUSTOMER: ${REFRESH_EXPIRY_CUSTOMER:-2160h}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-30}
      CHAT_TIMEOUT_SEC: ${CHAT_TIMEOUT_SEC:-45}
      CHAT_APP_SECRET: ${CHAT_APP_SECRET:-}
      # Relay AI via 9Router (opsional): isi ketiganya untuk lewat gateway
      # (failover multi-provider di UI 9Router), kosongkan = langsung Gemini.
      CHAT_PROVIDER_BASE_URL: ${CHAT_PROVIDER_BASE_URL:-}
      CHAT_PROVIDER_API_KEY: ${CHAT_PROVIDER_API_KEY:-}
      CHAT_PROVIDER_MODEL: ${CHAT_PROVIDER_MODEL:-}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "cd /app && /server"

  # AI gateway (OpenAI-compatible /v1/*) untuk relay chat. Internal only:
  # tanpa ports = tidak bisa dijangkau publik, hanya service compose
  # (backend → http://nine-router:20128). API key /v1 dibuat di UI
  # (http://localhost:20128 via SSH tunnel) lalu dimasukkan ke
  # CHAT_PROVIDER_* di atas. Komentari seluruh blok ini bila belum dipakai.
  nine-router:
    image: decolua/9router:latest
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      REQUIRE_API_KEY: "true"
      API_KEY_SECRET: ${NINE_ROUTER_API_SECRET:-change-me-9router-secret}
    volumes:
      - nine-router-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # WAJIB: NEXT_PUBLIC_* di-bake saat build, environment: saja tidak cukup.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    environment:
      # Same-origin via Caddy: browser memanggil <origin>/api/* -> backend.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - backend
      - frontend

  dozle:
    image: amir20/dozzle:latest
    # Bind ke localhost VPS saja (127.0.0.1) — akses via SSH tunnel, bukan publik.
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_USERNAME: ${DOZZLE_USERNAME:-admin}
      DOZZLE_PASSWORD: ${DOZZLE_PASSWORD:-ganti-password-dozle}
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  nine-router-data:
  caddy_data:
  caddy_config: